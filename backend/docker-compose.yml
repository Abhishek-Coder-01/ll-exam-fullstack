version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: ll-portal-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=ll_exam_portal

  mongo-express:
    image: mongo-express:1.0.2
    container_name: ll-portal-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
    depends_on:
      - mongo

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ll-portal-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - MONGO_URI=mongodb://mongo:27017/ll_exam_portal
      - NODE_ENV=production
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - mongo

volumes:
  mongo_data:
